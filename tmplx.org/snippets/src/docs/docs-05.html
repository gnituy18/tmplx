<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hello tmplx</title>
</head>
<body>
  <script type="text/tmplx">
    var count int
  </script>

  <h1>Counter</h1>

  <button tx-onclick="count--">-</button>
  <span>{ count }</span>
  <button tx-onclick="count++">+</button>
</body>
</html>

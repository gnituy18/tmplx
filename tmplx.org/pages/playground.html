<!-- prettier-ignore -->
<!DOCTYPE html>
<html lang="en">

<head>
  <title>Playground | tmplx</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/modern-normalize@3.0.1/modern-normalize.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/go/go.min.js"></script>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/snippets.css" />
</head>

<body class="pg">
  <tx-nav></tx-nav>
  <main class="pg-main">
    <div class="pg-bar">
      <h1>Playground</h1>
      <button id="compile" class="btn-compile" type="button">Compile</button>
      <span class="note">Your page compiles on the server as <code>pages/index.html</code> — type-checks only, never runs your code. Standard-library imports only.</span>
    </div>

    <div class="pg-wrap">
      <div class="pg-col">
        <h3>pages/index.html — tmplx source</h3>
        <div class="pg-box"><textarea id="src" spellcheck="false" tx-ignore><!DOCTYPE html>
<html>
<head>
  <title>Counter</title>
  <script type="text/tmplx">
    var counter int
  </script>
</head>
<body>
  <button tx-onclick="counter--">-</button>
  <span>{ counter }</span>
  <button tx-onclick="counter++">+</button>
</body>
</html></textarea></div>
      </div>
      <div class="pg-col">
        <h3>routes.go — generated Go</h3>
        <div id="out" class="pg-box"></div>
        <pre id="errors" class="pg-errors" style="display: none"></pre>
      </div>
    </div>
  </main>

  <script>
    (function () {
      var inCM = CodeMirror.fromTextArea(document.getElementById("src"), {
        mode: { name: "htmlmixed", scriptTypes: [{ matches: /text\/tmplx/, mode: "go" }] },
        theme: "tmplx",
        lineNumbers: true,
        tabSize: 2,
        indentUnit: 2,
        lineWrapping: false,
      });

      var outCM = CodeMirror(document.getElementById("out"), {
        mode: "go",
        theme: "tmplx",
        lineNumbers: true,
        readOnly: true,
        value: "",
      });

      var outEl = document.getElementById("out");
      var errEl = document.getElementById("errors");
      var btn = document.getElementById("compile");

      function showCode(code) {
        errEl.style.display = "none";
        outEl.style.display = "";
        outCM.setValue(code);
        outCM.refresh();
      }
      function showErrors(lines) {
        outEl.style.display = "none";
        errEl.style.display = "block";
        errEl.textContent = lines.join("\n");
      }

      async function compile() {
        var old = btn.textContent;
        btn.textContent = "Compiling...";
        btn.disabled = true;
        try {
          var res = await fetch("/playground/compile", { method: "POST", body: inCM.getValue() });
          var data = await res.json();
          if (data.diagnostics && data.diagnostics.length) showErrors(data.diagnostics);
          else showCode(data.code || "");
        } catch (e) {
          showErrors(["request failed: " + e]);
        } finally {
          btn.textContent = old;
          btn.disabled = false;
        }
      }

      btn.addEventListener("click", compile);
      compile();
    })();
  </script>
</body>

</html>

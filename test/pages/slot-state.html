<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>dynamic slot fill</title>
  <script type="text/tmplx">
    var msg = "hi"
  </script>
</head>

<body>
  <!-- a slot fill that interpolates PARENT state, and updates when it changes -->
  <tx-box>
    <span data-test="dynfill">filled: { msg }</span>
  </tx-box>
  <button data-test="change" tx-onclick='msg = "bye"'>change</button>
</body>

</html>

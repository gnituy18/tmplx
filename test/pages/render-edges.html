<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>render edges</title>
<script type="text/tmplx">
  var f = 1.0
  var g = 0.5
  var neg = -42
  var emoji = "hello world"
  var zero = 0
</script>
</head>
<body>
  <p data-test="re-f">[{ f }]</p>
  <p data-test="re-g">[{ g }]</p>
  <p data-test="re-neg">[{ neg }]</p>
  <p data-test="re-emoji">[{ emoji }]</p>
  <p data-test="re-zero">[{ zero }]</p>
</body>
</html>

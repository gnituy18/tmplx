<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Input</title>
  <script type="text/tmplx">
    var inputValue = ""
  </script>
</head>

<body>
  <input data-test="text-input" type="text" tx-oninput="inputValue = event.target.value" />
  <p data-test="echo">You typed: { inputValue } ({ len(inputValue) } chars)</p>
</body>

</html>
